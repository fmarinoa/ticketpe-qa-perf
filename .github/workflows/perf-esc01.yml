# ESC01 (API del núcleo) en GitHub Actions. Un rojo dice de quién es el problema antes de abrir un log:
#   gates (TAS + salud del ambiente) → casos TC-PERF-01..03 en fila → publish (Job Summary, triage IA, badge, Pages).
# En fila (max-parallel 1) para que la carga de un caso no contamine la medición de otro.
name: perf-esc01

on:
  workflow_dispatch:
    inputs:
      perfil:
        description: smoke = shakedown 1 VU · full = condición de carga de R3
        type: choice
        options: [smoke, full]
        default: smoke

concurrency:
  group: perf # nunca dos corridas a la vez sobre el entorno compartido
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: 2.2.0

      - name: Verificar el framework (TAS)
        run: |
          for f in tests/esc01-*.js; do k6 inspect "$f" > /dev/null || exit 1; done
          k6 run -q framework/informe.test.js \
            || { echo "::error title=Framework roto::El análisis automático o un script no pasa su verificación. No se genera carga: el defecto está en la automatización, no en el producto."; exit 1; }

      - name: Gate de salud del ambiente
        run: |
          k6 run -q framework/salud.js \
            || { echo "::error title=Ambiente caido::/api/core/health no responde sano. No se genera carga: es un fallo de ambiente, no una regresión de rendimiento."; exit 1; }

  run:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15 # por job: el caso más largo (TC-PERF-01 full) toma ~7.5 min
    strategy:
      max-parallel: 1
      fail-fast: false # un umbral incumplido no cancela los casos siguientes
      matrix:
        tc: [TC-PERF-01, TC-PERF-02, TC-PERF-03]
    env:
      TEAM: ${{ vars.TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: 2.2.0
      - name: Ejecutar ${{ matrix.tc }} (${{ inputs.perfil }})
        run: ./run.sh ${{ inputs.perfil }} ${{ matrix.tc }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-${{ matrix.tc }}
          path: reports/
          retention-days: 14

  publish:
    needs: [gates, run]
    if: always() && needs.gates.result == 'success' # se publica también cuando un umbral falla
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # los permissions de job reemplazan a los del workflow: sin esto el checkout del repo privado falla
      pages: write
      id-token: write
      copilot-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reports-*
          merge-multiple: true
          path: reports

      - name: Índice, badge y resumen
        run: |
          ./run.sh index
          cat reports/resumen.md >> "$GITHUB_STEP_SUMMARY"

      - name: Analizar fallo con IA
        if: needs.run.result == 'failure'
        run: |
          npm install -g @github/copilot
          scripts/analizar-fallo.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: reports
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
